# ─────────────────────────────────────────────────────────────
#  Nova — voice-first, local-first AI agent
#  This is the template. Setup copies it to config.yaml (your personal copy,
#  never committed). Secrets (API keys, bot token) go in .env, NOT here.
# ─────────────────────────────────────────────────────────────

assistant:
  name: Nova
  owner: Friend                 # your first name — setup asks for it
  timezone: UTC                 # IANA name, e.g. Africa/Johannesburg, Europe/London, America/New_York
  city: ""                      # used for weather in briefings
  max_history_turns: 12

llm:
  # Hybrid: local Ollama for everyday requests. Hard tasks / failures go down the "smart" list.
  # Providers without an API key in .env are skipped automatically.
  primary: ollama
  smart: [gemini, groq, xai] # tried in this order
  providers:
    ollama:
      base_url: http://localhost:11434/v1
      model: nova-qwen       # qwen2.5:3b with an 8k context window (made by setup). Fits 4 GB VRAM.
      timeout: 90
    gemini:                  # free API key: aistudio.google.com/apikey  -> GEMINI_API_KEY in .env
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-2.5-flash
      key_env: GEMINI_API_KEY
      timeout: 90
    groq:                    # free API key: console.groq.com/keys  -> GROQ_API_KEY in .env
      base_url: https://api.groq.com/openai/v1
      model: auto            # auto = best model your key can use; switches by itself when Groq retires one
      key_env: GROQ_API_KEY
      timeout: 60
    xai:                     # xAI Grok (paid): console.x.ai -> XAI_API_KEY in .env
      base_url: https://api.x.ai/v1
      model: auto
      key_env: XAI_API_KEY
      timeout: 90
    ollama_vision:           # fully local vision (setup offers to download it: `ollama pull gemma3:4b`, ~3.3 GB)
      base_url: http://localhost:11434/v1
      model: gemma3:4b
      timeout: 180
  # Vision (screen, photos, webcam, ads): tried in order. Gemini is sharper; local keeps working offline.
  vision_providers: [gemini, ollama_vision]
  # Requests containing these go straight to the smarter cloud model.
  escalate_keywords: ["think hard", "in detail", "plan ", "write a", "write me", "build a website", "analyse", "analyze",
                      "compare", "summarise", "summarize", "draft", "explain why", "strategy"]
  max_tool_rounds: 6
  keep_alive: 24h            # keep the local model loaded so replies start instantly (uses ~2.5 GB VRAM)

# God's Eye View — live 3D globe (planes, ships, satellites, quakes, weather, public cameras).
# Open source (github.com/bilawalsidhu/gods-eye-view). Needs Node.js 24. Say "install God's Eye View".
globe:
  dir: tools/gods-eye-view    # where it's installed
  port: 4173
  auto_start: false           # start it together with Nova

# Phone access with Tailscale (Settings → Remote access → Set up turns this on)
remote:
  enabled: false              # true = reconnect Tailscale and share Nova every time run.bat starts it

# Focus & wellbeing — one thing at a time, routines, night guardrails, private check-ins (encrypted, never sent to AI)
wellbeing:
  enabled: true
  focus_default: false        # open the dashboard in Focus mode
  nudge_minutes: 50           # gentle "time check" after this long on one thing
  anchors:                    # "HH:MM Name | step; step"
    - "07:30 Morning routine | Glass of water; Medication (if any); Pick today's one thing"
    - "12:30 Lunch — step away from the screen"
    - "22:30 Wind down | Dim the screens; Write tomorrow's one thing; Bed by 23:15"
  night: { enabled: true, from: "23:00", to: "06:30", hold_sends: true, release_at: "08:00" }
  buy_pause: true             # anything that buys waits 24 hours
  low_energy_auto: true
  signals: { short_sleep: true, short_sleep_hours: 6, late_nights: true, project_burst: true, burst_count: 4,
             energy_up: true, low_run: true }
  signals_telegram: false
  plan: ""                    # what you agreed with your doctor to do when a heads-up shows

# Load-shedding (EskomSePush) — free token in .env (ESP_TOKEN); say "find my load-shedding area Roodepoort".
loadshedding:
  area_id: ""
  warn: true                  # spoken + Telegram heads-up before your area's power goes off
  warn_minutes: 30

# News briefing — SA headlines + news about the companies you work with ("vendor news").
news:
  vendors: [Juniper Networks, Avaya, Nokia, SonarSource, Westcon-Comstor]

# Nightly dreaming — memory clean-up, connections, journal and an encrypted backup while you sleep.
dreaming:
  enabled: true
  at: "02:30"                 # if the PC is off then, it catches up ~10 min after Nova next starts
  consolidate: true           # merge duplicate memories (old versions kept as history)
  connect: true               # find related ideas and write them down
  people: true                # turn what you say about people into people cards
  weekly_digest: true         # Sunday night: "what's new in your brain" on Telegram (brain/Digests)
  journal: true               # brain/Journal/<date>.md
  backup: true                # encrypted with NOVA_BACKUP_PASSPHRASE (made for you the first time)
  backup_dir: backups
  backup_keep: 7
  drive_backup: false         # also copy each backup to Google Drive › Nova Backups

# Presence awareness — the webcam notices when you sit down or walk away (face detection, local, nothing saved).
# Phone hands: Nova operates your Android phone over ADB + Tailscale. Settings → Phone → Set up my phone.
phone:
  address: ""                # the phone's Tailscale IP (filled in by setup)
  name: ""
  adb_path: ""               # "" = Nova's own copy of Google's Android platform-tools

# Screen time from ActivityWatch (free, activitywatch.net — keeps its data on this PC)
activitywatch:
  enabled: true
  url: http://localhost:5600
  nudges: true               # kind nudge when you drift during work hours while a Focus task waits (never at night)
  nudge_after_minutes: 15
  nudge_every_minutes: 45
  work_start: "08:00"
  work_end: "17:00"
  work_days: [0, 1, 2, 3, 4] # Monday = 0
  distractions: [youtube, facebook, instagram, tiktok, netflix, reddit, twitter, x.com, showmax]

presence:
  enabled: false              # or say "turn on presence awareness"
  away_seconds: 60            # no face and no typing for this long = you've left
  greet: true                 # "Welcome back" (+ anything Nova held for you) after being away 5+ min
  greet_after_seconds: 300
  morning_briefing: true      # first time you sit down before noon: your morning briefing
  briefing_prompt: "I just sat down at my desk. Give me my short morning briefing: today's calendar, the weather and anything urgent."
  lock_pc: false              # lock Windows when you walk away
  lock_after_seconds: 120

# Gesture control — steer Nova with your hands via the webcam (MediaPipe, runs locally on the CPU).
gestures:
  enabled: false              # or say "turn on gestures"
  camera: 0                   # webcam number (0 = the first one)
  mirror: true                # move your hand right -> the pointer goes right
  style: hand                 # hand = move your whole hand, ✊ close = click · finger = older point-and-pinch
  mouse: true                 # the cursor follows your hand
  zoom: true                  # hand towards the camera = zoom in, pull back = zoom out
  fps: 12                     # hand checks per second (lower = lighter on the CPU)
  hand_actions:               # hand mode: enter | delete | back | forward | open_dashboard | listen | stop | none | key:<combo>
    thumbs_up: enter          # (says "yes" instead when Nova is waiting for an answer)
    thumbs_down: delete       # (says "no" instead when Nova is waiting for an answer)
    swipe_left: back
    swipe_right: open_dashboard
    victory: listen
  actions:                    # finger mode: stop | yes | no | listen | escape | dashboard | none | key:<combo>
    palm: stop
    thumbs_up: "yes"
    thumbs_down: "no"
    victory: listen
    fist: escape
    swipe_left: dashboard
    swipe_right: dashboard

voice:
  enabled: true
  wake_word: hey_jarvis      # built-in openWakeWord models: hey_jarvis, alexa, hey_mycroft
  wake_threshold: 0.5
  stt_model: base.en         # tiny.en | base.en | small.en | base (multilingual). Runs on CPU.
  stt_language: en           # null = auto-detect (e.g. Afrikaans, with a multilingual model)
  silence_seconds: 1.1       # stop recording after this much silence
  vad: silero                # silero = small AI that hears real speech (ignores fans/typing) · loudness = old way
  vad_threshold: 0.5         # higher = needs clearer speech
  max_record_seconds: 25
  follow_up_seconds: 6       # after replying, keep listening this long without needing the wake word
  max_spoken_chars: 450      # longer answers: speak the start, send the full text to Telegram
  chime: true                # little beep when Nova starts listening
  barge_in: true             # say the wake word (or press the hotkey) while Nova talks to interrupt it
  hotkey: "<ctrl>+<alt>+<space>"   # push-to-talk from anywhere in Windows; "" to disable

tts:
  engine: elevenlabs         # first choice: elevenlabs | kokoro | piper | windows
  fallback: [kokoro, piper, windows]   # tried in order if the first choice fails (no internet, no credits…)
  elevenlabs:
    voice_id: JBFqnCBsd6RMkjVDRZzb   # replace with your own voice ID from elevenlabs.io -> Voices
    model: eleven_flash_v2_5         # fastest; use eleven_multilingual_v2 for richer quality
    stability: 0.45
    similarity_boost: 0.8
    style: 0.15
    speed: 1.0
  kokoro:                    # natural local voice (Kokoro-82M, runs on CPU) — downloaded by setup
    model: models/kokoro-v1.0.int8.onnx
    voices: models/voices-v1.0.bin
    voice: bm_george         # British: bm_george bm_lewis bm_daniel bf_emma bf_isabella · American: am_adam af_heart af_bella
    lang: en-gb              # en-gb | en-us
    speed: 1.0
  piper:
    voice: voices/en_GB-alan-medium.onnx

telegram:
  enabled: true
  # Only these Telegram user IDs may control Nova. Message the bot /id to find yours.
  allowed_user_ids: []
  voice_replies: true        # answer voice notes with a voice note (your ElevenLabs voice)
  announce_online: true      # message you when Nova starts (🟢) and stops (🔴)
  file_forwards: true        # forwarded messages, bare links and files without a caption are filed in your brain
  quiet_hours: ["22:00", "07:00"]   # messages in these hours arrive without a buzz

google:
  enabled: true
  credentials_file: secrets/credentials.json
  token_file: secrets/token.json

brain:
  vault_dir: data/brain      # plain markdown notes — open in Obsidian if you like
  db_file: data/nova.db      # permanent memory, activity log, search index
  embed_model: nomic-embed-text
  learn_automatically: true  # extract new memories after every conversation
  structure: strict          # notes are filed under 01_Personal/ or 02_Work/ → numbered category (nova/taxonomy.py)

meetings:
  folder: workspace/meetings   # recordings (the notes go to the brain's Meetings folder)
  stt_model: small.en          # more accurate than the live-voice model; runs in the background
  create_tasks: true           # add YOUR action items to Google Tasks

dashboard:
  enabled: true
  port: 8765                 # http://localhost:8765
  open_on_start: true

files:
  # Nova may only touch files inside these folders.
  allowed_roots:
    - "~/Documents"
    - "~/Desktop"
    - "~/Downloads"
    - "~/Pictures"
    - "~/Videos"
    - "./workspace"

web:
  sites_dir: workspace/sites
  searxng_url: ""            # your private search engine, e.g. http://localhost:8888 (docs/ENHANCEMENTS.md)

media:
  output_dir: workspace/videos
  # Optional local AI images (Stable Diffusion 1.5, ~3 GB VRAM). Needs requirements-imagegen.txt
  captions: true             # burn subtitles into videos
  broll: true                # stock footage behind scenes when PEXELS_API_KEY is set (free at pexels.com/api)
  image_gen_enabled: false
  image_model: runwayml/stable-diffusion-v1-5
  image_provider: auto       # auto = ComfyUI when it's running · comfyui · local (the Stable Diffusion above)
  comfyui:                   # free local images: github.com/comfyanonymous/ComfyUI (install once, keep it running)
    url: http://127.0.0.1:8188
    checkpoint: ""           # part of a model name in ComfyUI/models/checkpoints ("" = the first one)
    start_command: ""        # e.g. C:\ComfyUI_windows_portable\run_nvidia_gpu.bat — Nova starts it when needed
    workflow: ""             # your own "Export (API)" workflow .json with {{prompt}} {{negative}} {{seed}} {{width}} {{height}}

# Documents: markitdown reads Word/PowerPoint/Excel/PDF/.msg/EPUB. Docling (optional, ~2 GB) = better PDF tables & scans.
documents:
  docling: auto              # auto = use docling once installed (Settings → Documents → Install) · off

# AI web agent (browser-use) — install once in Settings → Web agent. Stops before pay/buy/send/submit/delete.
web_agent:
  provider: auto             # auto = Gemini, then Groq, then Grok · or gemini | groq | xai | ollama
  model: ""                  # "" = the provider's default
  max_steps: 30
  headless: false            # true = no visible browser window
  chrome_path: ""            # "" = Chrome (or Edge)

system:
  allow_shell: true          # Nova may run PowerShell commands
  confirm: irreversible      # ask first for: irreversible (delete, send/reply email, invites, shutdown, submit) | all | never

# ─────────────────────────────────────────────────────────────
#  MCP servers — plug in any Model Context Protocol server (docs/MCP.md)
#  Same shape as Claude Desktop. Each server's tools become Nova tools.
#    keywords: words that make Nova offer this server's tools to the model
#    confirm:  auto (default: ask before write/destructive tools) | always | never | [tool names]
#    only_tools: [..] expose just these tools (keeps small local models focused)
# ─────────────────────────────────────────────────────────────
mcp_import_claude_desktop: false   # true = also load servers from Claude Desktop's config

mcp_servers:
  canva:                     # official Canva connector — designs, presentations, social posts (Settings → Extensions → Add)
    enabled: false
    command: npx
    args: ["-y", "mcp-remote@latest", "https://mcp.canva.com/mcp"]   # first start opens a Canva sign-in in your browser
    timeout: 300
    keywords: [canva, design, poster, flyer, social post, thumbnail, banner, brochure, presentation design, brand kit]
    confirm: auto

  windows:                   # control any Windows app: click, type, read the screen (CursorTouch/Windows-MCP)
    enabled: false
    command: uvx
    args: ["windows-mcp"]
    keywords: [window, app, desktop, click on, type into, excel, outlook app, settings app]
    confirm: auto

  excel:                     # read/write .xlsx workbooks (haris-musa/excel-mcp-server) — or Settings → Extensions → Add
    enabled: false
    command: uvx
    args: ["excel-mcp-server", "stdio"]
    env: { EXCEL_FILES_PATH: "${USERPROFILE}/Documents" }
    keywords: [excel, xlsx, spreadsheet, workbook, pivot]
    confirm: auto

  elevenlabs:                # sound effects, voice design, cloning (official elevenlabs-mcp; uses your key + credits)
    enabled: false
    command: uvx
    args: ["elevenlabs-mcp"]
    env: { ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY}", ELEVENLABS_MCP_BASE_PATH: "C:/nova/workspace/audio" }
    keywords: [sound effect, voice design, clone voice, elevenlabs, design a voice]
    confirm: auto

  youtube:                   # any YouTube video's transcript — "summarise this video"
    enabled: false
    command: uvx
    args: ["mcp-youtube-transcript"]
    keywords: [youtube, video transcript, summarise this video, summarize this video]
    confirm: never

  home_assistant:            # smart home — enable the "Model Context Protocol Server" integration in HA
    enabled: false
    url: http://homeassistant.local:8123/api/mcp
    headers: { Authorization: "Bearer ${HA_TOKEN}" }     # long-lived token in .env
    keywords: [light, lights, lamp, aircon, geyser, gate, alarm, temperature, thermostat, switch, plug]
    confirm: never

  github:                    # repos, issues, PRs (needs Docker + a GitHub token in .env)
    enabled: false
    command: docker
    args: ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
    env: { GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}" }
    keywords: [github, repo, pull request, issue]

  git:                       # history/diffs of a local repo
    enabled: false
    command: uvx
    args: ["mcp-server-git", "--repository", "C:/path/to/repo"]
    keywords: [git, commit, diff, branch]

  fetch:                     # fetch any URL as markdown (official reference server)
    enabled: false
    command: uvx
    args: ["mcp-server-fetch"]
    keywords: [fetch, url, http]

  blender:                   # 3D scenes in Blender (ahujasid/blender-mcp + its Blender add-on)
    enabled: false
    command: uvx
    args: ["blender-mcp"]
    keywords: [blender, 3d model, 3d scene, render]

  google_workspace_plus:     # alternative/extra Google tools: Slides, Forms, Chat… (taylorwilsdon/google_workspace_mcp)
    enabled: false
    command: uvx
    args: ["workspace-mcp", "--tools", "slides", "forms", "chat"]
    env: { GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}", GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}" }
    keywords: [slides, presentation, google form, google chat]

# Let Claude Desktop / Claude Code / Cursor use Nova's memory and skills (python -m nova.mcp_server)
nova_mcp_server:
  expose_groups: [brain, files, web, google, media]

