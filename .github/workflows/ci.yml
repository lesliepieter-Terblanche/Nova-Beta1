name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile everything
        run: python -m compileall -q nova main.py plugins scripts
      - name: Tests
        run: pytest -q
