<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova · Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #03040a; --accent: #8b7bff; --accent-2: #4cc9f0; --text: #eef1ff; --muted: #9aa3cc;
    --line: rgba(170,185,255,.16); --glass: rgba(14,18,36,.55);
    --sky1: #0b1a3a; --sky2: #1b3f7a; --display: "Space Grotesk","Segoe UI",system-ui,sans-serif; --body: "Inter","Segoe UI",system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font: 15px/1.5 var(--body); background: var(--bg); }
  body { background: radial-gradient(1200px 700px at 70% -10%, var(--sky2), transparent 60%), linear-gradient(180deg, var(--sky1), var(--bg) 85%);
    background-attachment: fixed; transition: background .8s; }
  .stars { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s;
    background-image: radial-gradient(1px 1px at 20% 30%, #fff9, transparent), radial-gradient(1px 1px at 70% 20%, #fff8, transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, #fff7, transparent), radial-gradient(1px 1px at 85% 60%, #fff9, transparent),
      radial-gradient(1px 1px at 10% 85%, #fff6, transparent), radial-gradient(1px 1px at 55% 45%, #fff8, transparent); background-size: 600px 600px; }
  .night .stars { opacity: 1; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 60px; position: relative; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%); box-shadow: 0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header a { color: var(--text); text-decoration: none; border: 1px solid var(--line); padding: 8px 12px; border-radius: 11px; font-size: 13px; }
  header .sp { flex: 1; }
  header .upd { color: var(--muted); font-size: 12.5px; }
  form.search { display: flex; gap: 6px; }
  form.search input { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 11px; color: var(--text); padding: 8px 12px; font: 14px var(--body); width: 200px; outline: none; }
  form.search button { border: 0; border-radius: 11px; padding: 8px 14px; font: 600 13px var(--body); cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #070914; }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 30px 34px; align-items: center; }
  .place { font: 500 15px var(--body); color: var(--muted); letter-spacing: .02em; }
  .temp { font: 600 116px/1 var(--display); letter-spacing: -4px; margin: 6px 0 4px; }
  .temp sup { font-size: 44px; vertical-align: top; position: relative; top: 14px; letter-spacing: 0; color: var(--muted); }
  .desc { font: 500 24px var(--display); text-transform: capitalize; }
  .say { margin-top: 16px; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 14.5px; color: #dfe4ff; }
  .say b { color: var(--accent-2); font-weight: 600; margin-right: 6px; }
  .iconbig { justify-self: center; width: 230px; height: 230px; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
  .fact { padding: 14px 16px; }
  .fact .l { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .fact .v { font: 600 22px var(--display); margin-top: 4px; }

  h2 { font: 600 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 26px 4px 10px; }
  .hours { padding: 18px 18px 12px; overflow-x: auto; }
  .hours svg { display: block; min-width: 900px; width: 100%; height: 190px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .day { padding: 16px 12px; text-align: center; cursor: pointer; transition: transform .2s, border-color .2s; }
  .day:hover { transform: translateY(-3px); }
  .day.on { border-color: color-mix(in srgb, var(--accent-2) 65%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-2) 40%, transparent), 0 24px 70px rgba(0,0,0,.35); }
  .day .n { font-weight: 600; }
  .day .d { color: var(--muted); font-size: 12px; }
  .day svg { width: 64px; height: 64px; margin: 6px auto; display: block; }
  .day .hl { font: 600 17px var(--display); }
  .day .hl span { color: var(--muted); font-weight: 500; }
  .day .bar { height: 5px; border-radius: 9px; margin: 10px 6px 6px; background: rgba(255,255,255,.08); position: relative; }
  .day .bar i { position: absolute; top: 0; bottom: 0; border-radius: 9px; background: linear-gradient(90deg, #4cc9f0, #ffd166, #ff7b54); }
  .day .rain { font-size: 12.5px; color: #8fd3ff; }
  .err { padding: 30px; text-align: center; }

  /* animated icons */
  .sun-rays { transform-origin: 50px 50px; animation: spin 24s linear infinite; }
  .cloud-drift { animation: drift 6s ease-in-out infinite alternate; }
  .drop { animation: fall 1.1s linear infinite; }
  .flash { animation: flash 3.2s infinite; }
  .flake { animation: fall 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(-3px); } to { transform: translateX(4px); } }
  @keyframes fall { 0% { transform: translateY(-6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
  @keyframes flash { 0%, 88%, 100% { opacity: 0; } 90%, 94% { opacity: 1; } }
  .fade { animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding: 24px; }
    .iconbig { width: 150px; height: 150px; grid-row: 1; }
    .temp { font-size: 84px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .days { grid-template-columns: repeat(2, 1fr); }
    form.search input { width: 130px; }
    header .upd { display: none; }
  }
  /* the whole page takes on the day's weather: sky colours, sunshine, clouds, rain, snow, lightning, frost, heat */
  body { background: radial-gradient(900px 620px at 82% -6%, var(--glow, transparent), transparent 62%), linear-gradient(180deg, var(--sky1), var(--sky2) 55%, var(--sky3, var(--bg))) fixed; }
  .glass { background: var(--card, var(--glass)); }
  .fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .wrap { z-index: 1; }
  .fx .sun { position: absolute; right: 6%; top: -90px; width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, #fff7c2 0 22%, #ffd166 34%, rgba(255,190,70,.45) 48%, transparent 70%); filter: blur(2px); animation: sunpulse 7s ease-in-out infinite; }
  .fx .rays { position: absolute; right: calc(6% - 320px); top: -410px; width: 1000px; height: 1000px; border-radius: 50%; opacity: .5; animation: spin 90s linear infinite;
    background: repeating-conic-gradient(from 0deg, rgba(255,225,140,.22) 0 5deg, transparent 5deg 18deg); -webkit-mask: radial-gradient(circle, transparent 0 17%, #000 22%, transparent 68%); mask: radial-gradient(circle, transparent 0 17%, #000 22%, transparent 68%); }
  .fx .moon { position: absolute; right: 9%; top: 60px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #cfd6ff 60%, #9aa6e0); box-shadow: 0 0 90px 30px rgba(170,185,255,.35); }
  .fx .cl { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,var(--ca,.55)), transparent 70%); filter: blur(14px); animation: sail linear infinite; }
  .fx .rd { position: absolute; top: -12vh; width: 2px; height: 78px; border-radius: 2px; background: linear-gradient(180deg, transparent, rgba(190,225,255,.85)); transform: rotate(12deg); animation: rainfall linear infinite; }
  .fx .sf { position: absolute; top: -4vh; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.8); animation: snowfall linear infinite; }
  .fx .bolt { position: absolute; inset: 0; background: radial-gradient(900px 500px at 70% 0, rgba(210,200,255,.85), transparent 70%); opacity: 0; animation: lightning 7s infinite; }
  .fx .fogband { position: absolute; left: -20%; width: 140%; height: 150px; background: linear-gradient(90deg, transparent, rgba(225,232,240,.34), transparent); filter: blur(22px); animation: sail 60s linear infinite alternate; }
  .fx .frost { position: absolute; inset: 0; box-shadow: inset 0 0 160px 50px rgba(200,235,255,.4); }
  .fx .heat { position: absolute; left: 0; right: 0; bottom: 0; height: 46vh; background: linear-gradient(0deg, rgba(255,120,40,.4), transparent); animation: sunpulse 5s ease-in-out infinite; }
  @keyframes sunpulse { 50% { transform: scale(1.06); opacity: .88; } }
  @keyframes sail { from { transform: translateX(-12vw); } to { transform: translateX(22vw); } }
  @keyframes rainfall { to { transform: translate(-22vh, 125vh) rotate(12deg); } }
  @keyframes snowfall { to { transform: translate(8vw, 112vh); } }
  @keyframes lightning { 0%, 91%, 94%, 100% { opacity: 0; } 92%, 95% { opacity: 1; } }
  .mood { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 999px; font: 600 11.5px var(--body); letter-spacing: .04em; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); vertical-align: middle; }
  @media (prefers-reduced-motion: reduce) { .fx * { animation: none !important; } }
  html.embed .fx { display: none; }
  /* shown inside the dashboard's centre window: no page background, no navigation */
  html.embed, html.embed body { background: transparent !important; }
  html.embed .stars, html.embed header a, html.embed header form.search { display: none; }
  html.embed .wrap { padding: 4px 6px 16px; }
</style>
<script>if (new URLSearchParams(location.search).get("embed")) document.documentElement.classList.add("embed");</script>
</head>
<body>
<div class="stars"></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <a href="/">← Brain</a>
    <span class="sp"></span>
    <span class="upd" id="upd"></span>
    <form class="search" id="search"><input id="q" placeholder="Another city…" autocomplete="off"><button>Go</button></form>
  </header>
  <main id="app"><div class="glass err">Loading the weather…</div></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let data = null, sel = +(new URLSearchParams(location.search).get("day") || 0);

// the look of the day: [sky top, sky middle, sky bottom, glow, accent, accent 2, card tint]
const MOODS = {
  clear:   ["#1e7fd6", "#56b6f0", "#ffd38a", "rgba(255,214,120,.75)", "#ffb938", "#ff7b54", "rgba(20,60,110,.42)"],
  partly:  ["#2a74c4", "#6aaee6", "#cfe3f5", "rgba(255,225,150,.5)", "#ffc857", "#4cc9f0", "rgba(22,52,100,.45)"],
  cloud:   ["#56657e", "#8493a8", "#b4bfcc", "transparent", "#9fb4d4", "#cfd8e6", "rgba(40,50,68,.5)"],
  fog:     ["#6c7783", "#98a2ac", "#c3cad0", "transparent", "#b9c6cf", "#e2e8ec", "rgba(55,62,70,.5)"],
  drizzle: ["#33506e", "#5b7c9c", "#8ea7bd", "transparent", "#7cc8ff", "#a8dcff", "rgba(18,34,54,.52)"],
  rain:    ["#182a40", "#345272", "#55738f", "transparent", "#5bb2ff", "#8fd3ff", "rgba(10,22,38,.58)"],
  showers: ["#2a4a72", "#4f7aa8", "#9fc0dc", "rgba(255,225,150,.3)", "#6cc0ff", "#ffd166", "rgba(16,32,56,.52)"],
  snow:    ["#7f97b6", "#b4c6dc", "#eef4fa", "rgba(255,255,255,.5)", "#bfe3ff", "#ffffff", "rgba(38,56,92,.62)"],
  storm:   ["#0c0f1f", "#2a2450", "#4a3f73", "rgba(150,130,255,.3)", "#b79cff", "#7ce0ff", "rgba(14,12,34,.62)"],
};
const NIGHT = { clear: ["#040818", "#101c46", "#1c2d5e"], partly: ["#060a1a", "#162248", "#26365e"], snow: ["#101a2c", "#2a3a56", "#56688a"] };
const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
function ambience(kind, isDay, temp) {
  const many = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join("");
  const clouds = (n, a) => many(n, (i) => `<i class="cl" style="left:${-10 + rnd(i, 1) * 95}%;top:${-6 + rnd(i, 2) * 46}%;width:${340 + rnd(i, 3) * 380}px;height:${130 + rnd(i, 4) * 120}px;--ca:${a};animation-duration:${70 + rnd(i, 5) * 80}s;animation-delay:-${rnd(i, 6) * 60}s"></i>`);
  const rain = (n, speed) => many(n, (i) => `<i class="rd" style="left:${rnd(i, 7) * 125}%;opacity:${.35 + rnd(i, 8) * .55};animation-duration:${speed + rnd(i, 9) * .5}s;animation-delay:-${rnd(i, 10) * 2}s"></i>`);
  const snow = (n) => many(n, (i) => { const z = 3 + rnd(i, 11) * 6; return `<i class="sf" style="left:${rnd(i, 12) * 100}%;width:${z}px;height:${z}px;opacity:${.5 + rnd(i, 13) * .5};animation-duration:${7 + rnd(i, 14) * 9}s;animation-delay:-${rnd(i, 15) * 12}s"></i>`; });
  let h = "";
  if (kind === "clear" || kind === "partly" || kind === "showers") h += isDay ? `<i class="rays"></i><i class="sun"></i>` : `<i class="moon"></i>`;
  if (kind === "partly") h += clouds(4, .5);
  if (kind === "cloud") h += clouds(8, .6);
  if (kind === "fog") h += clouds(4, .45) + many(4, (i) => `<i class="fogband" style="top:${18 + i * 20}%;animation-delay:-${i * 14}s"></i>`);
  if (kind === "drizzle") h += clouds(5, .4) + rain(34, 1.5);
  if (kind === "rain") h += clouds(6, .35) + rain(80, .85);
  if (kind === "showers") h += clouds(4, .45) + rain(50, 1);
  if (kind === "storm") h += clouds(7, .28) + rain(100, .7) + `<i class="bolt"></i>`;
  if (kind === "snow") h += clouds(5, .5) + snow(70);
  if (temp != null && temp <= 8 && kind !== "snow") h += `<i class="frost"></i>`;
  if (temp != null && temp >= 30 && isDay) h += `<i class="heat"></i>`;
  return h;
}
function feel(kind, temp, isDay = true) {
  const t = temp == null ? "" : temp <= 5 ? "Freezing" : temp <= 12 ? "Cold" : temp <= 18 ? "Cool" : temp <= 25 ? "Mild" : temp <= 30 ? "Warm" : "Hot";
  const k = { clear: isDay ? "sunshine" : "clear night", partly: isDay ? "sun and cloud" : "some cloud", cloud: "overcast", fog: "foggy", drizzle: "drizzle", rain: "rain", showers: "showers", snow: "snow", storm: "thunderstorm" }[kind] || "";
  return [t, k].filter(Boolean).join(" · ");
}
let fxKey = "";

function icon(kind, day = true) {
  const sun = `<g class="sun-rays">${Array.from({ length: 8 }, (_, i) => `<rect x="48.5" y="8" width="3" height="11" rx="1.5" fill="#ffd166" transform="rotate(${i * 45} 50 50)"/>`).join("")}</g>
    <circle cx="50" cy="50" r="19" fill="url(#sunG)"/>`;
  const moon = `<path d="M58 30a22 22 0 1 0 14 34 18 18 0 1 1-14-34z" fill="#e8ecff"/>`;
  const cloud = (dx = 0, dy = 0, c = "#e9eefc", s = 1) => `<g class="cloud-drift" transform="translate(${dx} ${dy}) scale(${s})"><path d="M30 72h42a14 14 0 0 0 0-28 20 20 0 0 0-38-4 13 13 0 0 0-4 32z" fill="${c}"/></g>`;
  const drops = (n = 5, color = "#7cc8ff") => Array.from({ length: n }, (_, i) => `<line class="drop" x1="${34 + i * 8}" y1="80" x2="${31 + i * 8}" y2="88" stroke="${color}" stroke-width="3" stroke-linecap="round" style="animation-delay:${i * .18}s"/>`).join("");
  const flakes = Array.from({ length: 5 }, (_, i) => `<circle class="flake" cx="${34 + i * 8}" cy="84" r="2.4" fill="#fff" style="animation-delay:${i * .4}s"/>`).join("");
  const bolt = `<path class="flash" d="M52 70l-8 14h7l-4 12 12-17h-7l5-9z" fill="#ffd166"/>`;
  const body = {
    clear: day ? sun : moon,
    partly: (day ? `<g transform="translate(-10 -10) scale(.8)">${sun}</g>` : `<g transform="translate(-6 -8) scale(.8)">${moon}</g>`) + cloud(6, 6, "#eef2ff", .9),
    cloud: cloud(-8, -4, "#9aa6c2", .9) + cloud(6, 4),
    fog: cloud(0, -6, "#b7c0d6") + `<g stroke="#c7cfe2" stroke-width="3" stroke-linecap="round" opacity=".8"><line x1="24" y1="84" x2="76" y2="84"/><line x1="30" y1="92" x2="70" y2="92"/></g>`,
    drizzle: cloud(0, -8) + drops(3),
    rain: cloud(0, -8, "#b8c4de") + drops(5),
    showers: (day ? `<g transform="translate(-12 -14) scale(.7)">${sun}</g>` : "") + cloud(2, -6) + drops(4),
    snow: cloud(0, -8) + flakes,
    storm: cloud(0, -10, "#8d97b3") + bolt + drops(3, "#9fb7ff"),
  }[kind] || cloud();
  return `<svg viewBox="0 0 100 100"><defs><radialGradient id="sunG"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffb938"/></radialGradient></defs>${body}</svg>`;
}

function hourlyChart(hours) {
  const W = 1000, H = 190, pad = 34, n = hours.length;
  const ts = hours.map((h) => h.temp), min = Math.min(...ts) - 2, max = Math.max(...ts) + 2;
  const x = (i) => pad + (i * (W - pad * 2)) / (n - 1), y = (t) => 30 + (1 - (t - min) / (max - min || 1)) * 70;
  const line = hours.map((h, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(h.temp).toFixed(1)}`).join(" ");
  const area = `${line} L${x(n - 1)},110 L${x(0)},110 Z`;
  let g = `<defs><linearGradient id="ta" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent-2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ta)"/><path d="${line}" fill="none" stroke="var(--accent-2)" stroke-width="2.5"/>`;
  hours.forEach((h, i) => {
    const cx = x(i);
    if (i % 2 === 0) {
      g += `<text x="${cx}" y="${y(h.temp) - 10}" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">${h.temp}°</text>
        <text x="${cx}" y="182" text-anchor="middle" fill="var(--muted)" font-size="12">${i === 0 ? "Now" : h.time}</text>`;
    }
    const bh = Math.round((h.rain / 100) * 38);
    if (h.rain > 0) g += `<rect x="${cx - 5}" y="${160 - bh}" width="10" height="${bh}" rx="3" fill="#7cc8ff" opacity=".7"/>`;
    if (i % 2 === 0 && h.rain >= 10) g += `<text x="${cx}" y="${156 - bh}" text-anchor="middle" fill="#8fd3ff" font-size="10.5">${h.rain}%</text>`;
    g += `<circle cx="${cx}" cy="${y(h.temp)}" r="${i === 0 ? 5 : 2.6}" fill="${i === 0 ? "#fff" : "var(--accent-2)"}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function sentence(d, i) {
  const c = d.current, day = d.days[i];
  if (i === 0) return `Right now in ${d.short} it's ${c.temp}° and ${c.desc}. Today reaches ${day.max}° with a low of ${day.min}°${day.rain >= 20 ? `, ${day.rain}% chance of rain` : ", staying dry"}.`;
  return `${day.name} in ${d.short}: ${day.desc}, ${day.min}° to ${day.max}°${day.rain >= 20 ? `, ${day.rain}% chance of rain` : ", staying dry"}.`;
}

function render() {
  const d = data, c = d.current, day = d.days[sel] || d.days[0];
  const kind = sel === 0 ? c.icon : day.icon, isDay = sel === 0 ? c.day : true;
  const temp = sel === 0 ? c.temp : day.max, m = MOODS[kind] || MOODS.partly, root = document.documentElement.style;
  const sky = isDay ? m.slice(0, 3) : (NIGHT[kind] || ["#05070f", m[0], m[1]]);
  root.setProperty("--sky1", sky[0]); root.setProperty("--sky2", sky[1]); root.setProperty("--sky3", sky[2]);
  root.setProperty("--glow", isDay ? m[3] : "rgba(150,165,255,.22)");
  root.setProperty("--accent", m[4]); root.setProperty("--accent-2", m[5]); root.setProperty("--card", isDay ? m[6] : "rgba(10,14,32,.6)");
  root.setProperty("--muted", isDay && ["clear", "partly", "snow", "cloud", "fog"].includes(kind) ? "#dbe6f5" : "#a9b6d8");
  document.body.classList.toggle("night", !isDay);
  const key = `${kind}|${isDay}|${temp <= 8}|${temp >= 30}`;                 // rebuild the sky only when the weather changes
  if (key !== fxKey) { fxKey = key; $("#fx").innerHTML = ambience(kind, isDay, temp); }
  const lo = Math.min(...d.days.map((x) => x.min)), hi = Math.max(...d.days.map((x) => x.max));
  $("#upd").textContent = "Updated " + d.updated.replace("T", " ");
  $("#app").innerHTML = `
    <section class="glass hero fade">
      <div>
        <div class="place">📍 ${esc(d.place)}</div>
        <div class="temp">${sel === 0 ? c.temp : day.max}<sup>°C</sup></div>
        <div class="desc">${esc(sel === 0 ? c.desc : day.desc)}<span class="mood">${esc(feel(kind, temp, isDay))}</span></div>
        <div class="say"><b>Nova</b>${esc(sentence(d, sel))}</div>
      </div>
      <div class="iconbig">${icon(kind, isDay)}</div>
    </section>
    <div class="facts">
      ${sel === 0 ? `<div class="glass fact"><div class="l">Feels like</div><div class="v">${c.feels}°</div></div>
        <div class="glass fact"><div class="l">Humidity</div><div class="v">${c.humidity}%</div></div>` :
        `<div class="glass fact"><div class="l">Low</div><div class="v">${day.min}°</div></div>
        <div class="glass fact"><div class="l">Rain</div><div class="v">${day.rain}% · ${day.rain_mm} mm</div></div>`}
      <div class="glass fact"><div class="l">Wind</div><div class="v">${sel === 0 ? c.wind : day.wind} km/h</div></div>
      <div class="glass fact"><div class="l">UV · Sun</div><div class="v">${day.uv ?? "–"} · ${day.sunrise}–${day.sunset}</div></div>
    </div>
    ${sel === 0 ? `<h2>Next 24 hours</h2><div class="glass hours">${hourlyChart(d.hours)}</div>` : ""}
    <h2>7 days</h2>
    <div class="days">${d.days.map((x, i) => `
      <div class="glass day ${i === sel ? "on" : ""}" data-i="${i}">
        <div class="n">${esc(x.name)}</div><div class="d">${esc(x.date.slice(5).replace("-", "/"))}</div>
        ${icon(x.icon)}
        <div class="hl">${x.max}° <span>${x.min}°</span></div>
        <div class="bar"><i style="left:${((x.min - lo) / (hi - lo || 1)) * 100}%;right:${100 - ((x.max - lo) / (hi - lo || 1)) * 100}%"></i></div>
        <div class="rain">${x.rain >= 10 ? "💧 " + x.rain + "%" : "&nbsp;"}</div>
      </div>`).join("")}</div>`;
}

document.addEventListener("click", (e) => {
  const d = e.target.closest(".day"); if (!d) return;
  sel = +d.dataset.i; history.replaceState(null, "", "?day=" + sel); render(); scrollTo({ top: 0, behavior: "smooth" });
});
$("#search").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q) load(q); });

async function load(place) {
  try {
    const r = await fetch("/api/weather" + (place === true ? "?refresh=1" : place ? "?place=" + encodeURIComponent(place) : ""));
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    data = j; if (typeof place === "string") sel = 0; render();
  } catch (e) { $("#app").innerHTML = `<div class="glass err">Couldn't load the weather: ${esc(e.message)}</div>`; }
}
load();
setInterval(() => load(true), 10 * 60 * 1000);
</script>
</body>
</html>
